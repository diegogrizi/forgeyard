schemaVersion: 1
id: hackathon
version: 1.0.0
packs:
  - foundation
  - delivery
  - presentation
  - ecosystem
catalog:
  selection: curated
  plugins:
    - accessibility-compliance
    - agent-orchestration
    - agent-teams
    - application-performance
    - backend-development
    - before-you-build
    - comprehensive-review
    - conductor
    - database-design
    - debugging-toolkit
    - deployment-validation
    - developer-essentials
    - documentation-generation
    - frontend-mobile-development
    - full-stack-orchestration
    - git-pr-workflows
    - llm-application-dev
    - pptx-deck-creation
    - security-scanning
    - startup-business-analyst
    - tdd-workflows
    - ui-design
defaults:
  timeboxMinutes: 300
  orchestration:
    mode: guided
    maxConcurrency: 4
  presentation:
    enabled: true
    audience: Product reviewers
    durationMinutes: 7
    offline: true
