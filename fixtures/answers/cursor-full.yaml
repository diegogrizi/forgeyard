schemaVersion: 1
project:
  name: Complete Factory
  purpose: Install the complete local capability catalog without loading every instruction at once.
  mode: new
harnesses:
  - cursor
profile: full
catalog:
  selection: all
  plugins: []
timeboxMinutes: 300
quality:
  commands:
    - name: test
      argv:
        - node
        - -e
        - process.exit(0)
paths:
  mutableRoots:
    - src
    - presentation
  protectedPaths:
    - .git
    - .env
  presentation: presentation
orchestration:
  mode: guided
  maxConcurrency: 4
presentation:
  enabled: true
  audience: Product reviewers
  durationMinutes: 7
  offline: true
