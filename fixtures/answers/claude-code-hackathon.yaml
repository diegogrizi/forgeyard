schemaVersion: 1
project:
  name: Signal Garden
  purpose: Help a small team demonstrate one trustworthy user journey.
  mode: new
harnesses:
  - claude-code
profile: hackathon
catalog:
  selection: curated
  plugins: []
timeboxMinutes: 300
quality:
  commands:
    - name: test
      argv:
        - node
        - -e
        - process.exit(0)
paths:
  mutableRoots:
    - src
  protectedPaths:
    - .git
    - .env
orchestration:
  mode: guided
  maxConcurrency: 4
