schemaVersion: 1
project:
  name: Minimal Factory
  purpose: Install only the trusted project workflow kernel.
  mode: new
harnesses:
  - claude-code
profile: minimal
catalog:
  selection: none
  plugins: []
timeboxMinutes: 300
quality:
  commands:
    - name: test
      argv:
        - node
        - -e
        - process.exit(0)
paths:
  mutableRoots:
    - src
  protectedPaths:
    - .git
    - .env
orchestration:
  mode: guided
  maxConcurrency: 4
